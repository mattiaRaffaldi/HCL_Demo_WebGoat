name: "HCL AppScan SAST+SCA -> Code Scanning (T2)"

on:
  #push:
  #  branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

env:
  # Datacenter ASoC. EU: eu.cloud.appscan.com
  SERVICE_URL: "cloud.appscan.com"
  # Nome scan univoco per run: serve per ritrovare gli scan id dopo l'action
  SCAN_NAME: "WebGoat-${{ github.run_id }}"

jobs:
  scan:
    name: AppScan SAST+SCA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # 1) LANCIO via action ufficiale: esegue SAST + SCA insieme.
      #    Invocazione allineata al main.yml funzionante:
      #    - versione v1.0.9 (ultima rilasciata e funzionante; la v1.0.8 usciva a vuoto)
      #    - niente scan_build_outputs: si scansiona il sorgente
      #    - wait_for_analysis: aspetta che l'analisi finisca
      #    Il security gate (fail_for_noncompliance) e' OFF per default.
      # ------------------------------------------------------------------
      - name: AppScan scan (SAST + SCA)
        uses: HCL-TECH-SOFTWARE/appscan-sast-action@v1.0.9
        with:
          asoc_key: ${{ secrets.ASOC_KEY }}
          asoc_secret: ${{ secrets.ASOC_SECRET }}
          application_id: ${{ vars.ASOC_APPID }}
          wait_for_analysis: true
          scan_name: ${{ env.SCAN_NAME }}

      # ------------------------------------------------------------------
      # 2) RECUPERO scan id per nome + DUMP diagnostico (SAST e SCA).
      #    Qui isoliamo le due incognite: nome del campo tecnologia e
      #    forma del JSON delle issue SCA. Tutto viene stampato e salvato.
      # ------------------------------------------------------------------
      - name: Discover scan IDs + diagnostics
        id: discover
        env:
          ASOC_TOKEN: ${{ secrets.ASOC_TOKEN }}
          # TODO(developer): Provision and rotate this token outside the repository.
        run: |
          set -euo pipefail
          mkdir -p diag

          asocToken="$ASOC_TOKEN"
          [ -n "$asocToken" ] || { echo "::error::Token vuoto."; exit 1; }

          # --- Recupero MIRATO: solo le scansioni di QUESTO run ---
          # Filtro server-side per nome (contiene il run_id, univoco) + ordine per data desc.
          # Account condiviso con migliaia di scansioni: filtrare e' anche questione di correttezza.
          curl -k -s -G "https://${SERVICE_URL}/api/v4/Scans" \
            --data-urlencode "\$filter=contains(Name,'${SCAN_NAME}')" \
            --data-urlencode "\$orderby=CreatedAt desc" \
            --data-urlencode "\$count=true" \
            -H 'Accept:application/json' -H "Authorization:Bearer $asocToken" \
            > diag/scans.json

          echo "=== Scansioni di questo run (Id | Name | Technology) ==="
          jq -r '.Items[]? | [.Id, .Name, .Technology] | @tsv' diag/scans.json || cat diag/scans.json

          # Technology confermata: StaticAnalyzer = SAST, ScaAnalyzer = SCA
          sast_id=$(jq -r '[.Items[]? | select(.Technology=="StaticAnalyzer")][0].Id // empty' diag/scans.json)
          sca_id=$(jq -r  '[.Items[]? | select(.Technology=="ScaAnalyzer")][0].Id // empty' diag/scans.json)

          echo "SAST scan id: ${sast_id:-<non identificato>}"
          echo "SCA  scan id: ${sca_id:-<non identificato>}"
          echo "sast_id=$sast_id" >> "$GITHUB_OUTPUT"
          echo "sca_id=$sca_id"  >> "$GITHUB_OUTPUT"

          curl -k -s -X GET "https://${SERVICE_URL}/api/v4/Account/Logout" \
            -H 'accept: */*' -H "Authorization: Bearer $asocToken" >/dev/null || true

      # ------------------------------------------------------------------
      # 3) SAST -> SARIF nativo -> Code scanning (flusso gia collaudato in T1)
      # ------------------------------------------------------------------
      - name: Get SAST SARIF report
        id: sarif
        if: steps.discover.outputs.sast_id != ''
        env:
          ASOC_KEY: ${{ secrets.ASOC_KEY }}
          ASOC_SECRET: ${{ secrets.ASOC_SECRET }}
        run: |
          set -euo pipefail
          scanId="${{ steps.discover.outputs.sast_id }}"

          asocToken=$(curl -k -s -X POST \
            --header 'Content-Type:application/json' --header 'Accept:application/json' \
            -d '{"KeyId":"'"$ASOC_KEY"'","KeySecret":"'"$ASOC_SECRET"'"}' \
            "https://${SERVICE_URL}/api/v4/Account/ApiKeyLogin" \
            | grep -oP '(?<="Token":\ ")[^"]*')
          [ -n "$asocToken" ] || { echo "::error::Token vuoto."; exit 1; }

          reportId=$(curl -k -s -X POST \
            --header 'Content-Type:application/json' --header 'Accept:application/json' \
            --header "Authorization:Bearer $asocToken" \
            -d '{"Configuration":{"Summary":true,"Details":true,"Discussion":true,"Overview":true,"TableOfContent":true,"Articles":true,"History":true,"Coverage":true,"MinimizeDetails":true,"ReportFileType":"SARIF","Title":"","Notes":"","Locale":"en"},"OdataFilter":"","ApplyPolicies":"None"}' \
            "https://${SERVICE_URL}/api/v4/Reports/Security/Scan/$scanId" \
            | grep -oP '(?<="Id":\ ")[^"]*')
          [ -n "$reportId" ] || { echo "::error::Creazione report SARIF fallita (piano Free?)."; exit 1; }

          while true; do
            reportStatus=$(curl -k -s -X GET --header 'Accept:text/xml' \
              --header "Authorization:Bearer $asocToken" \
              "https://${SERVICE_URL}/api/v4/Reports/$reportId/Download" \
              | grep -oP '(?<="Message":\ ")[^"]*' || true)
            [ "$reportStatus" = "Report is not available" ] && { echo "SARIF in generazione..."; sleep 30; } || { echo "SARIF pronto."; break; }
          done

          mkdir -p sarif
          curl -k -s -X GET --header "Authorization:Bearer $asocToken" \
            "https://${SERVICE_URL}/api/v4/Reports/$reportId/Download" -o "sarif/appscan-sast.raw.sarif"

          if ! jq -e '.version and .runs' sarif/appscan-sast.raw.sarif >/dev/null 2>&1; then
            echo "::error::Il file scaricato non sembra un SARIF valido."; head -c 500 sarif/appscan-sast.raw.sarif || true; exit 1
          fi

          # Normalizzazione del SARIF per GitHub:
          #  1) rimuove eventuale BOM (via jq) e il campo guid non-RFC4122 dai result;
          #  2) gli URI in artifacts[] sono assoluti "file:///src/main/..." -> GitHub
          #     non li mappa al repo. Togliendo "file:///" diventano relativi alla root
          #     ("src/main/...") e gli alert si agganciano al codice. I result puntano
          #     agli artifacts per index, quindi basta correggere la tabella artifacts.
                    jq '
            # Mappa severità testuale -> level SARIF (GitHub alert level)
            def to_level($s):
              ($s // "" | ascii_downcase) as $x
              | if ($x=="critical" or $x=="high") then "error"
                elif ($x=="medium") then "warning"
                elif ($x=="low" or $x=="info" or $x=="informational" or $x=="information") then "note"
                else "warning"
                end;

            # Mappa severità testuale -> security-severity numerica (GitHub security ranking)
            def to_secsev($s):
              ($s // "" | ascii_downcase) as $x
              | if $x=="critical" then "9.8"
                elif $x=="high" then "8.0"
                elif $x=="medium" then "5.0"
                elif ($x=="low" or $x=="info" or $x=="informational" or $x=="information") then "2.0"
                else "0.0"
                end;

            # Recupera severità da campi possibili (result-level o rule-level, standard o vendor)
            def pick_sev($r; $rule):
              (
                $r.properties.severity
                // $r.properties.Severity
                // $r.level
                // $rule.properties.severity
                // $rule.properties.Severity
                // $rule.defaultConfiguration.level
                // ""
              );

            # 0) fix preesistenti necessari
            del(.runs[].results[]?.guid)
            | (.runs[]?.artifacts[]?.location.uri) |= (if type=="string" then sub("^file:///"; "") else . end)

            # 1) per ogni run: prepara indice regole per ruleId
            | .runs |= map(
                . as $run
                | ($run.tool.driver.rules // []) as $rules
                | ($rules | map({key: .id, value: .}) | from_entries) as $rule_by_id

                # 2) riscrive results[].level usando severità AppScan quando disponibile
                | .results = (
                    (.results // []) | map(
                      . as $r
                      | ($rule_by_id[($r.ruleId // "")] // {}) as $rule
                      | (pick_sev($r; $rule)) as $sev
                      | .level = to_level($sev)
                    )
                  )

                # 3) arricchisce rules[] con security-severity + tag security (senza perdere campi esistenti)
                | .tool.driver.rules = (
                    $rules | map(
                      . as $rule
                      | (
                          $rule.properties.severity
                          // $rule.properties.Severity
                          // $rule.defaultConfiguration.level
                          // ""
                        ) as $sev
                      | .properties = ((.properties // {})
                          + {"security-severity": ((.properties["security-severity"] // to_secsev($sev)) | tostring)}
                          + {"tags": (
                              ((.properties.tags // []) + ["security"])
                              | unique
                            )}
                        )
                    )
                  )
              )
          ' sarif/appscan-sast.raw.sarif > sarif/appscan-sast.sarif
          rm -f sarif/appscan-sast.raw.sarif
          echo "sarif_path=sarif/appscan-sast.sarif" >> "$GITHUB_OUTPUT"

          curl -k -s -X GET "https://${SERVICE_URL}/api/v4/Account/Logout" \
            -H 'accept: */*' -H "Authorization: Bearer $asocToken" >/dev/null || true

      - name: Upload SAST SARIF to Code scanning
        if: steps.sarif.outputs.sarif_path != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ steps.sarif.outputs.sarif_path }}
          category: appscan-sast

      # ------------------------------------------------------------------
      # T2b) SCA: issue JSON -> SARIF custom (jq inline) -> Code scanning
      #      SARIF nativo ASoC e' SAST-only, quindi convertiamo noi le issue SCA
      #      (endpoint /api/v4/Issues/Scan/{scaId}) direttamente con jq, nello step.
      # ------------------------------------------------------------------
      - name: Get SCA issues + convert to SARIF
        id: sca
        if: steps.discover.outputs.sca_id != ''
        env:
          ASOC_KEY: ${{ secrets.ASOC_KEY }}
          ASOC_SECRET: ${{ secrets.ASOC_SECRET }}
        run: |
          set -euo pipefail
          scaId="${{ steps.discover.outputs.sca_id }}"

          asocToken=$(curl -k -s -X POST \
            --header 'Content-Type:application/json' --header 'Accept:application/json' \
            -d '{"KeyId":"'"$ASOC_KEY"'","KeySecret":"'"$ASOC_SECRET"'"}' \
            "https://${SERVICE_URL}/api/v4/Account/ApiKeyLogin" \
            | grep -oP '(?<="Token":\ ")[^"]*')
          [ -n "$asocToken" ] || { echo "::error::Token vuoto."; exit 1; }

          mkdir -p sarif diag
          # Issue SCA in JSON (per questa app le 73 issue rientrano in una sola risposta)
          curl -k -s -X GET "https://${SERVICE_URL}/api/v4/Issues/Scan/${scaId}" \
            -H 'Accept:application/json' -H "Authorization:Bearer $asocToken" \
            -o diag/sca-issues.json

          if ! jq -e '.Items' diag/sca-issues.json >/dev/null 2>&1; then
            echo "::error::Risposta issue SCA inattesa."; head -c 500 diag/sca-issues.json || true; exit 1
          fi

          # Conversione JSON -> SARIF in jq puro (nessuno script esterno).
          # - una regola per CVE (unique_by .id), severita -> level SARIF
          # - security-severity dal CVSS (usato da GitHub per ordinare la gravita)
          # - ancoraggio a pom.xml; fingerprint = AsmHash (stabile e distinto per issue)
          jq '
            {"Critical":"error","High":"error","Medium":"warning","Low":"note","Information":"note"} as $lvl
            | {
                "$schema": "https://json.schemastore.org/sarif-2.1.0.json",
                version: "2.1.0",
                runs: [ {
                  tool: { driver: {
                    name: "HCL AppScan SCA",
                    informationUri: "https://www.hcl-software.com/appscan",
                    rules: ( [ .Items[] | {
                                id: (.Cve // .CveId // .Id // "UNKNOWN"),
                                cvss: ((.Cvss // "0") | tostring),
                                cwe: .Cwe,
                                url: (.DetailsUrl // "")
                              } ]
                             | unique_by(.id)
                             | map( {
                                 id: .id,
                                 name: "OpenSourceVulnerability",
                                 shortDescription: { text: (.id + " in open-source dependency") },
                                 properties: {
                                   "security-severity": .cvss,
                                   tags: ( ["security","sca"] + (if .cwe != null then ["external/cwe/cwe-" + (.cwe|tostring)] else [] end) )
                                 }
                               }
                               + (if .url != "" then { helpUri: .url, help: { text: ("Advisory: " + .url) } } else {} end) ) )
                  } },
                  results: [ .Items[] | {
                    ruleId: (.Cve // .CveId // .Id // "UNKNOWN"),
                    level: ($lvl[.Severity] // "warning"),
                    message: { text: (
                        (.LibraryName // "?") + " " + (.LibraryVersion // "?")
                        + " is affected by " + (.Cve // .CveId // "?")
                        + " (CVSS " + ((.Cvss // "0")|tostring)
                        + (if .Cwe != null then ", CWE-" + (.Cwe|tostring) else "" end) + ")."
                        + (if .LatestReleaseVersion != null then " Recommended fix: upgrade to " + .LatestReleaseVersion + "." else "" end)
                        + (if (.DetailsUrl // "") != "" then " Details: " + .DetailsUrl else "" end)
                    ) },
                    locations: [ { physicalLocation: {
                        artifactLocation: { uri: (.Location // .SourceFile // "pom.xml") },
                        region: { startLine: 1 }
                    } } ],
                    partialFingerprints: { appscanScaHash: ((.AsmHash // .Id // ((.Cve//"") + ":" + (.LibraryName//"") + ":" + (.LibraryVersion//""))) | tostring) }
                  } ]
                } ]
              }
          ' diag/sca-issues.json > sarif/appscan-sca.sarif

          if ! jq -e '.version and .runs' sarif/appscan-sca.sarif >/dev/null 2>&1; then
            echo "::error::SARIF SCA generato non valido."; exit 1
          fi
          echo "sca_sarif=sarif/appscan-sca.sarif" >> "$GITHUB_OUTPUT"

          curl -k -s -X GET "https://${SERVICE_URL}/api/v4/Account/Logout" \
            -H 'accept: */*' -H "Authorization: Bearer $asocToken" >/dev/null || true

      - name: Upload SCA SARIF to Code scanning
        if: steps.sca.outputs.sca_sarif != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ steps.sca.outputs.sca_sarif }}
          category: appscan-sca

      # ------------------------------------------------------------------
      # 4) Artefatto diagnostico: lista scansioni + campione issue SCA + SARIF
      #    (e' la base per scrivere il convertitore SCA in T2b)
      # ------------------------------------------------------------------
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appscan-t2-diagnostics
          path: |
            diag/
            sarif/
