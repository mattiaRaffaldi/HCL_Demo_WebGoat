name: "HCL AppScan SAST - SAClientUtil via REST API"

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  ASOC_BASE_URL: "https://cloud.appscan.com"   # EU: https://eu.cloud.appscan.com
  MAX_CRITICAL: "0"
  MAX_HIGH: "0"
  MAX_MEDIUM: "10"

jobs:
  sast:
    name: AppScan SAST (SAClientUtil)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build
        run: mvn -B clean package -DskipTests --file pom.xml

      # 1) Download della SAClientUtil via REST API
      - name: Download & install SAClientUtil
        run: |
          set -euo pipefail
          mkdir -p "$HOME/SAClientUtil"
          curl --fail -L "${ASOC_BASE_URL}/api/v4/Tools/SAClientUtilByType?toolType=Linux" \
            -H "Accept: application/octet-stream" -o "$HOME/saclient.zip"
          unzip -q "$HOME/saclient.zip" -d "$HOME/SAClientUtil"
          BIN="$(find "$HOME/SAClientUtil" -type f -name appscan.sh | head -n1)"
          [ -n "$BIN" ] || { echo "::error::appscan.sh non trovato"; find "$HOME/SAClientUtil" -maxdepth 4 | sort; exit 1; }
          chmod +x "$BIN"
          echo "APPSCAN_BIN=$BIN" >> "$GITHUB_ENV"

      - name: Login
        env:
          ASOC_KEY: ${{ secrets.ASOC_KEY }}
          ASOC_SECRET: ${{ secrets.ASOC_SECRET }}
        run: |
          "$APPSCAN_BIN" api_login -u "$ASOC_KEY" -P "$ASOC_SECRET" -persist
          "$APPSCAN_BIN" version

      # 2) Genera IRX e invia la SAST (al posto del plugin ufficiale)
      - name: Prepare IRX
        run: |
          mkdir -p irx
          "$APPSCAN_BIN" prepare -d irx -n "webgoat_${{ github.run_id }}"

      - name: Queue analysis
        id: queue
        run: |
          set -euo pipefail
          IRX="$(find irx -name '*.irx' | head -n1)"
          OUT="$("$APPSCAN_BIN" queue_analysis -a "${{ vars.ASOC_APPID }}" -f "$IRX" -sao \
                 -n "SAST - ${{ github.ref_name }}_${{ github.sha }}")"
          echo "$OUT"
          SCAN_ID="$(echo "$OUT" | grep -oiE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' | head -n1)"
          [ -n "$SCAN_ID" ] || { echo "::error::scan id non trovato"; exit 1; }
          echo "scan_id=$SCAN_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for completion
        env:
          ASOC_KEY: ${{ secrets.ASOC_KEY }}
          ASOC_SECRET: ${{ secrets.ASOC_SECRET }}
        run: |
          set -euo pipefail
          SCAN_ID="${{ steps.queue.outputs.scan_id }}"
          for i in $(seq 1 60); do
            S="$(curl --fail -s "${ASOC_BASE_URL}/api/v4/Scans/${SCAN_ID}" \
                 -H "X-Api-Key: ${ASOC_KEY}:${ASOC_SECRET}" | jq -r '.LatestExecution.Status')"
            echo "[$i] $S"
            case "$S" in
              Ready)          exit 0 ;;
              Failed|Stopped) echo "::error::scan $S"; exit 1 ;;
            esac
            sleep 30
          done
          echo "::error::timeout"; exit 1

      # 3) Security gate sui threshold
      - name: Security gate
        env:
          ASOC_KEY: ${{ secrets.ASOC_KEY }}
          ASOC_SECRET: ${{ secrets.ASOC_SECRET }}
        run: |
          set -euo pipefail
          J="$(curl --fail -s "${ASOC_BASE_URL}/api/v4/Scans/${{ steps.queue.outputs.scan_id }}" \
               -H "X-Api-Key: ${ASOC_KEY}:${ASOC_SECRET}")"
          C="$(echo "$J" | jq -r '.LatestExecution.NCriticalIssues // .NCriticalIssues // 0')"
          H="$(echo "$J" | jq -r '.LatestExecution.NHighIssues // .NHighIssues // 0')"
          M="$(echo "$J" | jq -r '.LatestExecution.NMediumIssues // .NMediumIssues // 0')"
          echo "Critical=$C High=$H Medium=$M (max $MAX_CRITICAL/$MAX_HIGH/$MAX_MEDIUM)"
          [ "$C" -le "$MAX_CRITICAL" ] && [ "$H" -le "$MAX_HIGH" ] && [ "$M" -le "$MAX_MEDIUM" ] \
            || { echo "::error::security gate non superato"; exit 1; }

      # 4) Report HTML come artefatto (anche se il gate fallisce)
      - name: Generate HTML report
        if: always() && steps.queue.outputs.scan_id != ''
        run: |
          mkdir -p reports
          "$APPSCAN_BIN" get_report -i "${{ steps.queue.outputs.scan_id }}" \
            -s scan -f html -d reports/appscan-sast-report.html -applyPolicies
      - name: Upload report artifact
        if: always() && steps.queue.outputs.scan_id != ''
        uses: actions/upload-artifact@v4
        with:
          name: appscan-sast-report
          path: reports/
